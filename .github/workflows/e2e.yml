name: E2E
on:
  push: { branches: [main, develop] }
  pull_request: { branches: [main] }
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: e2e_test }
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma migrate deploy
        env: { DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_test }
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_test
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      - run: npx playwright test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_test
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/e2e_test
          BASE_URL: http://localhost:3000
          TEST_JWT_TOKEN: ${{ secrets.TEST_JWT_TOKEN }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report/ }

  ai-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
        working-directory: sahiixx-e2e
      - run: npx playwright install --with-deps chromium
        working-directory: sahiixx-e2e
      - run: npx playwright test --project=ai --reporter=list
        working-directory: sahiixx-e2e
        env: { BASE_URL: http://localhost:3000 }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: ai-eval-report, path: sahiixx-e2e/playwright-report/ }
