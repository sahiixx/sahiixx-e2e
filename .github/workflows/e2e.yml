name: E2E
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Fast path for PRs — no target services or provider secrets required.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npx playwright test --project=contracts --project=lead-machine --reporter=list
        env:
          BASE_URL: http://localhost:3000
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: playwright-report/

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [smoke]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e_test
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_test
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      - run: npx playwright test --project=chromium --project=ai --project=lead-machine
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e_test
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/e2e_test
          BASE_URL: http://localhost:3000
          TEST_JWT_TOKEN: ${{ secrets.TEST_JWT_TOKEN }}
          RUN_DB_SETUP: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  # Full AI project on push only (can be expanded to nightly LIVE_E2E later)
  ai-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=ai --reporter=list
        env:
          BASE_URL: http://localhost:3000
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-report
          path: playwright-report/
